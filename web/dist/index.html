<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>itsoc. — SOC console</title>
    <script>
      // Apply the saved/OS theme before first paint to avoid a flash. Stamps
      // both the `dark` class (tailwind darkMode:"class") and data-theme (the
      // design-token contract in src/index.css) — same source, two consumers.
      try {
        var t = localStorage.getItem("itsoc-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark" : "light";
        }
        if (t === "dark") document.documentElement.classList.add("dark");
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* no storage: stay light */ }
    </script>
